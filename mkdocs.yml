site_name: Ultimate AI Guide for Developers
site_url: https://rsercano.github.io/ultimate-ai-guide-for-devs
site_description: A structured learning path for software developers transitioning into AI/LLM engineering
site_author: rsercano
docs_dir: docs

repo_name: rsercano/ultimate-ai-guide-for-devs
repo_url: https://github.com/rsercano/ultimate-ai-guide-for-devs

theme:
  name: material
  palette:
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
  
  font:
    text: Inter
    code: JetBrains Mono
  
  icon:
    repo: fontawesome/brands/github

copyright: Licensed under CC BY 4.0

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

plugins:
  - search

nav:
  - Home: index.md
  - 01 - How LLMs Work:
    - Overview: 01-how-llms-work/index.md
    - Tokenization to Output: 01-how-llms-work/01-tokenization-to-output.md
    - Attention Mechanism: 01-how-llms-work/02-attention-mechanism.md
    - Transformer Architecture: 01-how-llms-work/03-transformer-architecture.md
    - Resources: 01-how-llms-work/resources.md
  - 02 - Training & Learning:
    - Overview: 02-training-and-learning/index.md
    - Neural Network Basics: 02-training-and-learning/01-neural-network-basics.md
    - Loss and Backpropagation: 02-training-and-learning/02-loss-and-backprop.md
    - Optimization & Regularization: 02-training-and-learning/03-optimization-and-regularization.md
    - Resources: 02-training-and-learning/resources.md
  - 03 - NLP & Embeddings:
    - Overview: 03-nlp-tokenization-embeddings/index.md
    - Tokenization Strategies: 03-nlp-tokenization-embeddings/01-tokenization-strategies.md
    - Embeddings Explained: 03-nlp-tokenization-embeddings/02-embeddings-explained.md
