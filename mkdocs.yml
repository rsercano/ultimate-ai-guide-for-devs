    - Tool Calling & Agents: 05-prompting-tools-eval/02-tool-calling-agents.md
    - Evaluation Strategies: 05-prompting-tools-eval/03-evaluation-strategies.md
    - Resources: 05-prompting-tools-eval/resources.md
  - 06 - Fine-tuning & RLHF:
    - Overview: 06-finetuning-and-rlhf/index.md
    - Training Pipeline Overview: 06-finetuning-and-rlhf/01-training-pipeline-overview.md
