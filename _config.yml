# GitHub Pages Configuration
title: Ultimate AI Guide for Developers
description: A structured, top-down learning path for software developers transitioning into AI/LLM engineering.
baseurl: "/ultimate-ai-guide-for-devs"
url: "https://rsercano.github.io"

# Theme
remote_theme: just-the-docs/just-the-docs@v0.8.2
color_scheme: dark

# Repository
gh_repo: ultimate-ai-guide-for-devs
gh_repo_owner: rsercano

# Aux links (top right)
aux_links:
  "GitHub":
    - "https://github.com/rsercano/ultimate-ai-guide-for-devs"

aux_links_new_tab: true

# Navigation - enable and expand by default
nav_enabled: true
nav_sort: case_insensitive
heading_anchors: true

# Collapse navigation by default (expand on click)
nav_fold: false

# Search
search_enabled: true
search:
  heading_level: 2
  previews: 3
  preview_words_before: 5
  preview_words_after: 10

# Footer
footer_content: "Licensed under <a href=\"https://creativecommons.org/licenses/by/4.0/\">CC BY 4.0</a>"

# Back to top link
back_to_top: true
back_to_top_text: "Back to top"

# Default layout
defaults:
  - scope:
      path: ""
    values:
      layout: default

# Plugins
plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag

# Exclude from build
exclude:
  - .git
  - .gitignore
  - node_modules
  - vendor
  - Gemfile
  - Gemfile.lock
  - README.md
